# Runs the CLI, designer, remote, and firmware's off-hardware tests on every pull request. The
# generated recipe files, the reference frames, and the recipes in patterns/ only stay honest if
# these run, and this repo has no commit hooks.
name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/cli/go.mod
          cache-dependency-path: tools/cli/go.sum

      - name: Boot CLI
        working-directory: tools/cli
        run: go test ./...

      - uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bash tools/setup-worktree.sh

      # Both clients share transport code; check the remote's controls as well as the designer.
      - name: Boot remote
        working-directory: app
        run: |
          bun run build
          bun run build:native
          bun run test

      - name: Designer
        working-directory: designer
        run: |
          bun run typecheck
          bun run test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Firmware logic
        run: |
          pip install platformio
          pio test -e native
