# App actions wrap the same package scripts used by .claude/launch.json.
# Keep dev-server behavior in app/package.json and designer/package.json.
version = 1
name = "Firewalker"

[setup]
script = "bash tools/setup-worktree.sh"

[[actions]]
name = "Firewalker"
icon = "run"
command = "bun run --cwd app dev"

[[actions]]
name = "iPhone remote"
icon = "run"
command = "bun run --cwd app dev:native --port 5174"
