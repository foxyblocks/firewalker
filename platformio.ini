; Firewalker Shoes — wearable NeoPixel firmware
;
; First test board: Arduino Uno R3 (ATmega328P, 2 KB SRAM, 16 MHz).
; Bring-up scope only: drive the first 60 pixels of ONE WS2812B strip at a
; conservative, USB-safe brightness and print status over serial. No
; accelerometer, animation state machine, or wireless yet (kept deliberately
; boring until the hardware loop is proven reliable).
;
; Docs: https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Serial monitor baud — must match SERIAL_BAUD in include/config.h.
monitor_speed = 115200

; Adafruit NeoPixel drives the WS2812B strip. Pinned to a known-good minor
; line; bump deliberately, not incidentally.
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
