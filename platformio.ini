; Firewalker Shoes — wearable NeoPixel firmware
;
; Target board: Adafruit Feather RP2040.
; Build/upload with
;   pio run -e adafruit_feather [-t upload]
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = adafruit_feather

[env:adafruit_feather]
framework = arduino
monitor_speed = 115200            ; must match SERIAL_BAUD in include/config.h
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather
