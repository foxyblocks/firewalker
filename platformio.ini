; Firewalker Shoes — wearable NeoPixel firmware
;
; Target board: Adafruit Feather RP2040.
; Build/upload with
;   pio run -e final_app_left  [-t upload]   ; left shoe
;   pio run -e final_app_right [-t upload]   ; right shoe
;   pio run -e final_app       [-t upload]   ; bench default (= right foot)
;   pio run -e imu_debug       [-t upload]
; Off-hardware tests of the pure math (firewalker_fusion.h, firewalker_strip_map.h):
;   pio test -e native
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = final_app

; Shared settings for the firmware (on-board) environments. Kept in a custom
; section instead of [env] so the native test environment doesn't inherit the
; Arduino framework, the RP2040 platform, or the hardware lib_deps.
[feather]
framework = arduino
monitor_speed = 115200            ; must match SERIAL_BAUD in include/config.h
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit MPU6050 @ ^2.2.6
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather

; Foot side: both shoes are identical hardware builds, so left vs right is a
; firmware flag that flips the chirality-sensitive IMU signs (see config.h
; "Foot side"). Without a flag the firmware defaults to RIGHT — the bare
; final_app / imu_debug envs stay valid for bench work; flash real shoes with
; the explicit _left / _right envs. The boot log prints which foot is running.
[env:final_app]
extends = feather
build_flags =
    -DFIREWALKER_MODE_FINAL_APP

[env:final_app_left]
extends = feather
build_flags =
    -DFIREWALKER_MODE_FINAL_APP
    -DFIREWALKER_FOOT_LEFT

[env:final_app_right]
extends = feather
build_flags =
    -DFIREWALKER_MODE_FINAL_APP
    -DFIREWALKER_FOOT_RIGHT

[env:imu_debug]
extends = feather
build_flags =
    -DFIREWALKER_MODE_IMU_DEBUG

; Host-native unit tests (Unity) for pure logic — no Arduino, no hardware.
; src/ is not compiled here (test_build_src defaults to no); tests include the
; pure headers from include/ directly.
[env:native]
platform = native
test_framework = unity
