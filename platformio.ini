; Firewalker Shoes: wearable LED firmware
;
; Target board: Seeed Studio XIAO MG24 Sense. Build and upload with:
;   pio run -e final_app [-t upload]    ; the shoe app, the same on both shoes
;   pio run -e imu_debug [-t upload]    ; motion calibration, logs over USB
;   pio run -e strip_test [-t upload]   ; cycle colors on every pixel
;   pio run -e strip_off [-t upload]    ; blank every pixel
; With two boards connected, add --upload-port <usb serial>; `pio device list` shows
; them. Uploads refuse to guess which shoe you meant.
; Off-hardware tests of the pure logic:
;   pio test -e native
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = final_app

; Shared settings for the MG24 firmware. Kept in a custom section instead of [env] so
; the native test environment doesn't inherit the Arduino framework or the platform.
; The platform commit pins the Silicon Labs core (3.0.0) and OpenOCD. The extra script
; pins the compiler to Arm GNU 12.2.rel1; see tools/pio/mg24_stack.py for why.
[mg24]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#a6fd41debbbcda13b5340fff50c9092ed3289194
board = seeed-xiao-mg24
framework = arduino
upload_protocol = cmsis-dap
monitor_speed = 115200            ; must match SERIAL_BAUD in include/config.h
extra_scripts = pre:tools/pio/mg24_stack.py
custom_mg24_stack = none
lib_deps = seeed-studio/Seeed Arduino LSM6DS3 @ 2.0.5

[env:final_app]
extends = mg24
custom_mg24_stack = ble_silabs
build_flags = -DFIREWALKER_MODE_FINAL_APP

[env:imu_debug]
extends = mg24
build_flags = -DFIREWALKER_MODE_IMU_DEBUG

; The `cli` tool builds this environment, passing its test settings through
; PLATFORMIO_BUILD_SRC_FLAGS. See src/modes/bench.cpp.
[env:bench]
extends = mg24
build_flags = -DFIREWALKER_MODE_BENCH

; Measures recipe speed and memory on a real board, over USB. See src/modes/recipe_budget.cpp.
[env:recipe_budget]
extends = mg24
custom_mg24_stack = ble_silabs
build_flags = -DFIREWALKER_MODE_RECIPE_BUDGET

[env:strip_test]
extends = mg24
build_flags =
    -DFIREWALKER_MODE_BENCH
    -DBENCH_TEST=2

[env:strip_off]
extends = mg24
build_flags =
    -DFIREWALKER_MODE_BENCH
    -DBENCH_TEST=3

; Host-native unit tests (Unity) for pure logic: no Arduino, no hardware. src/ is not
; compiled here (test_build_src defaults to no); tests include the pure headers from
; include/ directly.
[env:native]
platform = native
test_framework = unity
; Memory and undefined-behavior checks. The recipe decoder has to survive any bytes at all, and these
; turn a read past the end of a buffer into a failed test.
extra_scripts = pre:tools/pio/native_sanitize.py
