; Firewalker Shoes — wearable NeoPixel firmware
;
; Target board: Adafruit Feather RP2040.
; Build/upload with
;   pio run -e final_app [-t upload]
;   pio run -e fsr_debug [-t upload]
;   pio run -e imu_debug [-t upload]
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = final_app

[env]
framework = arduino
monitor_speed = 115200            ; must match SERIAL_BAUD in include/config.h
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather

[env:final_app]
build_flags =
    -DFIREWALKER_MODE_FINAL_APP

[env:fsr_debug]
build_flags =
    -DFIREWALKER_MODE_FSR_DEBUG

; imu_debug additionally pulls in the Adafruit MPU6050 driver (and its BusIO /
; Unified Sensor deps); the other envs don't link it.
[env:imu_debug]
build_flags =
    -DFIREWALKER_MODE_IMU_DEBUG
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit MPU6050 @ ^2.2.6
