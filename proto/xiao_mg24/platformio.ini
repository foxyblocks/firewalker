; Standalone MG24 strip test. Uses test_calib/ as its source directory so the
; main motion-driven sketch and Feather firmware are not compiled into it.
; From the repository root: pio run -d proto/xiao_mg24 -t upload
[platformio]
default_envs = strip_test
src_dir = test_calib

[env:strip_test]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#a6fd41debbbcda13b5340fff50c9092ed3289194
board = seeed-xiao-mg24
framework = arduino
upload_protocol = cmsis-dap

; Send black to every connected pixel and keep the data output idle between
; frames. The board and strip remain powered; unplug USB to remove power.
[env:strip_off]
extends = env:strip_test
build_flags = -DFIREWALKER_STRIP_OFF
